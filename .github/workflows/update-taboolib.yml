name: Update TabooLib

on:
  schedule:
    # 避开整点；GitHub 的定时工作流可能在高负载时延迟执行。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taboolib-update
  cancel-in-progress: false

jobs:
  update:
    name: Check and update TabooLib
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Read the latest published TabooLib commit build
        id: taboolib
        shell: python
        run: |
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          metadata_url = "https://repo.tabooproject.org/repository/releases/io/izzel/taboolib/common/maven-metadata.xml"
          with urllib.request.urlopen(metadata_url, timeout=30) as response:
              metadata = ET.parse(response)

          # 按 Maven 元数据中的发布顺序选择 commit 构件，不按 hash 排序。
          # 不使用 <latest>/<release>，它们可能指向 test/dev 版本。
          versions = [
              node.text for node in metadata.findall("./versioning/versions/version")
              if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7,40}", node.text or "")
          ]
          if not versions:
              raise SystemExit("::error::No published TabooLib commit build found in Maven metadata")
          latest_version = versions[-1]

          configured_versions = re.findall(
              r'^\s*taboolib\s*=\s*"([^"\r\n]+)"',
              Path("build.gradle.kts").read_text(encoding="utf-8"),
              re.MULTILINE,
          )
          if len(configured_versions) != 1:
              raise SystemExit("::error::Expected exactly one TabooLib build version in build.gradle.kts")

          current_version = configured_versions[0]
          needs_update = str(current_version != latest_version).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"current_version={current_version}\n")
              output.write(f"latest_version={latest_version}\n")
              output.write(f"needs_update={needs_update}\n")

          print(f"TabooLib: {current_version} -> {latest_version} (needs_update={needs_update})")

      - name: Update the configured TabooLib build version
        if: steps.taboolib.outputs.needs_update == 'true'
        env:
          TABOOLIB_VERSION: ${{ steps.taboolib.outputs.latest_version }}
        run: |
          set -euo pipefail

          sed -i -E "s|^([[:space:]]*taboolib[[:space:]]*=[[:space:]]*)\"[^\"]+\"|\1\"${TABOOLIB_VERSION}\"|" build.gradle.kts
          git diff --check

          if git diff --quiet -- build.gradle.kts; then
            echo "::error::TabooLib version replacement made no change"
            exit 1
          fi

      - name: Build with the updated TabooLib version
        if: steps.taboolib.outputs.needs_update == 'true'
        run: ./gradlew --no-daemon build

      - name: Commit and push the TabooLib update
        if: steps.taboolib.outputs.needs_update == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TABOOLIB_VERSION: ${{ steps.taboolib.outputs.latest_version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "build(deps): 升级 TabooLib 至 ${TABOOLIB_VERSION}"
          # 构建期间远端若有新提交，推送失败并留待下次重新验证，绝不强制覆盖。
          git push origin "HEAD:${DEFAULT_BRANCH}"
